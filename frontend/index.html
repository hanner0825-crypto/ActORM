<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActORM - Catálogo de Productos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- Encabezado con Bootstrap -->
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold text-primary mb-2">
        <i class="bi bi-box-seam me-2"></i>Catálogo de Productos
      </h1>
      <p class="lead text-secondary">
        Gestión de inventario consultada desde el backend Flask (SQLAlchemy)
      </p>
      <hr class="w-25 mx-auto border-primary border-2 opacity-50">
    </div>

    <!-- Contenedor dinámico de tarjetas -->
    <div id="cards-container" class="row g-4 justify-content-center">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando productos...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:5000/products';

    async function cargarProductos() {
      const container = document.getElementById('cards-container');
      
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        container.innerHTML = '';

        // Tomar los 5 registros
        const productos = data.slice(0, 5);

        if (productos.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center">
              <div class="alert alert-info shadow-sm" role="alert">
                No se encontraron productos en la base de datos.
              </div>
            </div>`;
          return;
        }

        productos.forEach(prod => {
          const cardHtml = `
            <div class="col-md-4 col-sm-6">
              <div class="card h-100 border-0 shadow-sm rounded-4 hover-shadow">
                <div class="card-body d-flex flex-column p-4">
                  
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-dark rounded-pill px-3 py-2">ID: ${prod.id}</span>
                    <span class="badge bg-info-subtle text-info-emphasis rounded-pill px-3 py-2 border border-info-subtle">
                      ${prod.categoria_nombre || 'Categoría ' + prod.categoria_id}
                    </span>
                  </div>

                  <h5 class="card-title fw-bold text-dark mb-2">${prod.nombre}</h5>
                  <p class="card-text text-muted flex-grow-1 small">${prod.descripcion || 'Sin descripción disponible.'}</p>

                  <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <h4 class="fw-bold text-success mb-0">
                      $${Number(prod.precio).toLocaleString('es-CO')}
                    </h4>
                    <span class="badge bg-light text-secondary border">
                      <i class="bi bi-stack me-1"></i>Min: ${prod.stock_min}
                    </span>
                  </div>

                </div>
              </div>
            </div>
          `;
          container.innerHTML += cardHtml;
        });

      } catch (error) {
        console.error('Error al conectar con la API:', error);
        container.innerHTML = `
          <div class="col-12 text-center py-4">
            <div class="alert alert-danger shadow-sm d-inline-block" role="alert">
              <h5 class="alert-heading fw-bold mb-1"><i class="bi bi-exclamation-triangle-fill me-2"></i>Error de conexión</h5>
              <p class="mb-0">Asegúrate de que la API en Flask se esté ejecutando (<code>python main.py</code>).</p>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', cargarProductos);
  </script>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
